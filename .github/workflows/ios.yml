# The iPhone app. Builds the same index.html into a native shell (Capacitor) on GitHub's Mac computers, so nobody needs
# Xcode. Every run: builds for the iPhone simulator, opens it there and saves screenshots (light and dark) to the run.
# When Maceo's App Store Connect key is in the secrets, it also signs the app and sends it to TestFlight.
#   secrets  ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect, Users and Access, Integrations, a key with Admin
#            access), APPLE_TEAM_ID (developer.apple.com, Membership)
#   variable IOS_BUNDLE_ID (Settings, Variables; defaults to com.dialedincoffeeapp.ios): must match the app in App Store Connect
# Runs when pushed to the `ios` branch, or by hand (Actions, ios, Run workflow). Nothing here touches the website.
name: ios
on:
  push:
    branches: [ios]
  workflow_dispatch:

jobs:
  # a quick check of the App Store Connect key with Apple itself (a minute, on Linux), so a key problem is reported in
  # plain words instead of deep inside Xcode's signing; the build below skips TestFlight when it fails
  check:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.apple.outputs.ok }}
      why: ${{ steps.apple.outputs.why }}
      asc_from: ${{ steps.apple.outputs.asc_from }}
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.dialedincoffeeapp.ios' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
      APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the App Store Connect key with Apple
        id: apple
        run: |
          if [ -z "$ASC_KEY_P8" ]; then echo "ok=0" >> "$GITHUB_OUTPUT"; echo "why=none" >> "$GITHUB_OUTPUT"; echo "::notice title=Apple key check::No App Store Connect key yet."; exit 0; fi
          node native/scripts/apple-check.js

  build:
    needs: check
    if: always()
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write   # (only to put the simulator screenshots on the ios-shots branch)
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.dialedincoffeeapp.ios' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
      APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Make the iPhone project
        working-directory: native
        run: |
          set -e
          sed -i '' "s/\"appId\": \"[^\"]*\"/\"appId\": \"$BUNDLE_ID\"/" capacitor.config.json
          npm install --no-audit --no-fund
          node scripts/www.js
          npx cap add ios
          npx cap sync ios
          bash ios-setup.sh
          echo "VERSION=$(cat www/version.txt)" >> "$GITHUB_ENV"
          echo "::notice title=iPhone app::bundle ID $BUNDLE_ID, version $(cat www/version.txt), build ${{ github.run_number }}, app ID in capacitor.config.json: $(node -p "require('./capacitor.config.json').appId")"
          if [ -d ios/App/App.xcworkspace ]; then echo "XC=-workspace ios/App/App.xcworkspace" >> "$GITHUB_ENV"; else echo "XC=-project ios/App/App.xcodeproj" >> "$GITHUB_ENV"; fi
          xcodebuild -version | head -1
      - name: Build for the simulator
        working-directory: native
        run: |
          set -o pipefail
          xcodebuild $XC -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd TARGETED_DEVICE_FAMILY=1 CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$VERSION" build | tail -25
      - name: Open it in the simulator and take screenshots
        working-directory: native
        continue-on-error: true
        run: |
          set -e
          dev=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone 16') or x['name'].startswith('iPhone 17')))")
          xcrun simctl boot "$dev"; xcrun simctl bootstatus "$dev" -b >/dev/null
          app=build/dd/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl install "$dev" "$app"
          mkdir -p build/shots
          for look in light dark; do
            xcrun simctl ui "$dev" appearance $look
            xcrun simctl terminate "$dev" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$dev" "$BUNDLE_ID"
            sleep 15
            xcrun simctl io "$dev" screenshot "build/shots/$look.png"
          done
          ls -la build/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: native/build/shots
          if-no-files-found: ignore
      - name: Put the screenshots on the ios-shots branch (easier to look at than a zip)
        if: always()
        continue-on-error: true
        run: |
          [ -d native/build/shots ] && ls native/build/shots/*.png >/dev/null 2>&1 || exit 0
          d="$RUNNER_TEMP/shots"; rm -rf "$d"; mkdir -p "$d"; cp native/build/shots/*.png "$d/"
          cd "$d"; git init -q; git checkout -q -b ios-shots
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q --allow-empty -m "Simulator screenshots from run ${{ github.run_number }} ($GITHUB_SHA)"
          git add -A; git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q --amend --no-edit
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ios-shots
          echo "screenshots on ios-shots: $(ls)"
      - name: Is there an App Store Connect key yet?
        id: cfg
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "::notice title=TestFlight::No App Store Connect key yet: built for the simulator only."
          elif [ "${{ needs.check.outputs.ok }}" != "1" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "::error title=TestFlight::Not sent: the Apple key check failed (${{ needs.check.outputs.why }}); its message says what to change."
          else echo "::notice title=TestFlight::App Store Connect key found (ids only checked for presence): signing and uploading"; fi
      - name: Sign and send to TestFlight
        if: steps.cfg.outputs.skip != '1'
        working-directory: native
        run: |
          set -eo pipefail
          # the App Store Connect key is in whichever secrets App Store Connect accepted (the check job worked it out)
          if [ "${{ needs.check.outputs.asc_from }}" = "APNS" ]; then ASC_KEY_ID="$APNS_KEY_ID"; ASC_KEY_P8="$APNS_KEY_P8"; fi
          ASC_KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d "\"' \t\r\n"); ASC_ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d "\"' \t\r\n"); APPLE_TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -d "\"' \t\r\n")
          mkdir -p "$HOME/.appstoreconnect/private_keys"; key="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          # the .p8 text however it was pasted (one line, no header, quotes, Windows line ends): rebuilt as a proper key file
          body=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r"' | sed -e 's/-----BEGIN [A-Z ]*-----//g' -e 's/-----END [A-Z ]*-----//g' | tr -d ' \n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$body" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$key"; chmod 600 "$key"
          S="$RUNNER_TEMP/sign"; mkdir -p "$S"
          printf 'ASC_KEY_ID=%s\nASC_ISSUER_ID=%s\nASC_KEY_FILE=%s\n' "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$key" > "$S/asc.env"

          # this run's distribution certificate and App Store profile, made through the App Store Connect API
          ASC_KEY_ID="$ASC_KEY_ID" ASC_ISSUER_ID="$ASC_ISSUER_ID" ASC_KEY_FILE="$key" RUN_NUMBER="${{ github.run_number }}" node scripts/apple-sign.js "$S"
          PROFILE_NAME=$(grep '^PROFILE_NAME=' "$S/profile.env" | cut -d= -f2-); PROFILE_UUID=$(grep '^PROFILE_UUID=' "$S/profile.env" | cut -d= -f2-)

          # a keychain of its own for the certificate (the runner is thrown away afterwards)
          KC="$RUNNER_TEMP/sign.keychain-db"; KCPW=$(openssl rand -hex 16); P12PW=$(openssl rand -hex 16)
          security create-keychain -p "$KCPW" "$KC"; security set-keychain-settings -lut 21600 "$KC"; security unlock-keychain -p "$KCPW" "$KC"
          /usr/bin/openssl x509 -inform der -in "$S/cert.cer" -out "$S/cert.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$S/key.pem" -in "$S/cert.pem" -out "$S/cert.p12" -passout pass:"$P12PW"
          security import "$S/cert.p12" -k "$KC" -P "$P12PW" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          curl -fsSL -o "$S/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer && security import "$S/wwdr.cer" -k "$KC" >/dev/null 2>&1 || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          ids=$(security find-identity -v -p codesigning "$KC" | grep -c "Apple Distribution" || true)
          [ "$ids" -ge 1 ] || { echo "::error title=Signing::The distribution certificate didn't install as a signing identity."; exit 1; }
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do mkdir -p "$d"; cp "$S/profile.mobileprovision" "$d/$PROFILE_UUID.mobileprovision"; done

          # the app (only the App target) signs by hand with them
          python3 - "$APPLE_TEAM_ID" "$PROFILE_NAME" "$BUNDLE_ID" <<'PY'
          import re, sys
          team, profile, bundle = sys.argv[1:4]
          p = 'ios/App/App.xcodeproj/project.pbxproj'
          s = open(p).read()
          s = re.sub(r'\n\s*(CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|"?CODE_SIGN_IDENTITY(\[sdk=iphoneos\*\])?"?|CODE_SIGN_ENTITLEMENTS) = [^;]*;', '', s)
          add = (f'CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = {team}; PROVISIONING_PROFILE_SPECIFIER = "{profile}"; '
                 f'CODE_SIGN_IDENTITY = "Apple Distribution"; "CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution"; CODE_SIGN_ENTITLEMENTS = App/App.entitlements; ')
          s, n = re.subn(r'(\n(\s*)PRODUCT_BUNDLE_IDENTIFIER = )[^;]*;', lambda m: f'{m.group(1)}{bundle};\n{m.group(2)}' + add.replace('; ', ';\n' + m.group(2)).rstrip(), s)
          open(p, 'w').write(s)
          print(f'App target configurations set to sign by hand: {n}')
          if n < 1: sys.exit(1)
          PY

          xcodebuild $XC -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            TARGETED_DEVICE_FAMILY=1 MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" OTHER_CODE_SIGN_FLAGS="--keychain $KC" \
            archive > build/archive.log 2>&1 || { grep -E "error:|Error |No profiles|requires a provisioning|Signing|Provisioning" build/archive.log | head -15 | while IFS= read -r l; do echo "::error title=Archive::$l"; done; tail -40 build/archive.log; exit 1; }
          tail -3 build/archive.log
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist build/ExportOptions.plist -exportPath build/out > build/export.log 2>&1 || { grep -E "error|Error" build/export.log | head -15 | while IFS= read -r l; do echo "::error title=Export::$l"; done; tail -40 build/export.log; exit 1; }
          ipa=$(ls build/out/*.ipa | head -1); echo "app file: $(basename "$ipa"), $(du -h "$ipa" | cut -f1)"
          # the upload (the key is found by its Key ID in ~/.appstoreconnect/private_keys)
          xcrun altool --upload-app -f "$ipa" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" > build/upload.log 2>&1 || { grep -iE "error|fail|invalid" build/upload.log | grep -v "$ASC_KEY_ID" | head -15 | while IFS= read -r l; do echo "::error title=Upload::$l"; done; tail -20 build/upload.log | grep -v "$ASC_KEY_ID"; exit 1; }
          grep -iE "UPLOAD SUCCEEDED|No errors" build/upload.log | head -3 || true
          touch "$S/uploaded"
          echo "::notice title=TestFlight::Sent build ${{ github.run_number }} (v$VERSION, $BUNDLE_ID) to App Store Connect; it shows up in TestFlight after Apple processes it (10 to 30 minutes)."
      - name: If nothing was uploaded, take this run's certificate back
        if: always() && steps.cfg.outputs.skip != '1'
        working-directory: native
        run: |
          S="$RUNNER_TEMP/sign"
          [ -f "$S/profile.env" ] && [ ! -f "$S/uploaded" ] || exit 0
          export $(grep -v '^$' "$S/asc.env" | xargs)
          node scripts/apple-sign.js --undo "$S" || true
