# Loads the database into the Supabase project and checks it, from GitHub (which can reach Supabase). Safe to run
# again: the tables are only ever made once (an empty project); after that it brings api.sql (the app's calls) up to
# date, checks the project, runs the shadow check, and after the move carries over late Sheet saves. Runs when this is pushed to the `supabase-setup` branch, or by hand once on main.
# Needs the secret SUPABASE_DB_PASSWORD or SUPABASE_DB_URL. The logs are public: nothing here prints anyone's data.
name: supabase setup
on:
  push:
    branches: [supabase-setup]
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: glombusdjwlrgjihnylk
      PROJECT_URL: https://glombusdjwlrgjihnylk.supabase.co
      PUBLISHABLE_KEY: sb_publishable_nunu5PQVtCf8OuAhyt_hXw_xK3A4-8i
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SHEET_URL: https://script.google.com/macros/s/AKfycbxwOpOjQr2Um3y_YIddTIsn8yLAEqyQo5BnF001N9E58O4cT9x-7tMM6XGviIGTkNJp-Q/exec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Find the database
        run: |
          set +e
          bash supabase/find_db.sh 2> "$RUNNER_TEMP/find.txt"; rc=$?
          cat "$RUNNER_TEMP/find.txt"; bash supabase/report.sh "Find the database" "$RUNNER_TEMP/find.txt"; exit $rc
      - name: Load the database (only into an empty project; all three files in one go, all or nothing)
        run: |
          set +e
          if [ "$(psql "$DB_URL" -Atqc "select to_regclass('public.profiles') is not null")" = "t" ]; then
            # already loaded: bring the app's calls up to date (api.sql only ever replaces functions, triggers and grants, so
            # it's safe to run again; schema.sql and storage.sql are never rerun)
            PGOPTIONS='-c client_min_messages=warning' psql "$DB_URL" -1 -q -v ON_ERROR_STOP=1 -f supabase/api.sql 2>&1 | tee "$RUNNER_TEMP/load.txt"; rc=${PIPESTATUS[0]}
            [ $rc -eq 0 ] && echo "Already loaded: brought api.sql up to date." | tee -a "$RUNNER_TEMP/load.txt"
            bash supabase/report.sh "Load" "$RUNNER_TEMP/load.txt"; exit $rc
          fi
          PGOPTIONS='-c client_min_messages=warning' psql "$DB_URL" -1 -q -v ON_ERROR_STOP=1 -f supabase/schema.sql -f supabase/api.sql -f supabase/storage.sql 2>&1 | tee "$RUNNER_TEMP/load.txt"
          rc=${PIPESTATUS[0]}; [ $rc -eq 0 ] && echo "Loaded schema.sql, api.sql and storage.sql." | tee -a "$RUNNER_TEMP/load.txt"
          bash supabase/report.sh "Load" "$RUNNER_TEMP/load.txt"; exit $rc
      - name: Learn tags (every coffee tagged by the app's own recognizer; counts only in the log)
        run: |
          set +e
          node supabase/learn_tags.js --psql "psql '$DB_URL'" 2>&1 | tee "$RUNNER_TEMP/learn.txt"; rc=${PIPESTATUS[0]}
          bash supabase/report.sh "Learn tags" "$RUNNER_TEMP/learn.txt"; exit $rc
      - name: Content filter word list (an open list, loaded into the database only; never kept in the repo)
        run: |
          set +e
          # LDNOOBW's English list (CC BY 4.0): https://github.com/LDNOOBW/List-of-Dirty-Naughty-Obscene-and-Otherwise-Bad-Words
          curl -fsSL --retry 3 https://raw.githubusercontent.com/LDNOOBW/List-of-Dirty-Naughty-Obscene-and-Otherwise-Bad-Words/master/en -o "$RUNNER_TEMP/words.txt"; rc=$?
          if [ $rc -ne 0 ] || [ "$(wc -l < "$RUNNER_TEMP/words.txt")" -lt 100 ]; then echo "couldn't fetch the word list (kept the one already loaded)" | tee "$RUNNER_TEMP/w.txt"; bash supabase/report.sh "Word list" "$RUNNER_TEMP/w.txt"; exit 0; fi
          { echo "create temp table w (word text); copy w from stdin;"; tr -d '\r' < "$RUNNER_TEMP/words.txt" | sed 's/\\/\\\\/g' | grep -v '^[[:space:]]*$'; echo '\.';
            echo "insert into blocked_words (word) select distinct lower(btrim(word)) from w where char_length(btrim(word)) >= 2 on conflict do nothing;";
            echo "select 'words on the list: ' || internal.load_word_pattern();"; } | psql "$DB_URL" -Atq -v ON_ERROR_STOP=1 > "$RUNNER_TEMP/w.txt" 2>&1
          rc=$?; cat "$RUNNER_TEMP/w.txt"; bash supabase/report.sh "Word list" "$RUNNER_TEMP/w.txt"; exit $rc
      - name: Check the project
        run: |
          set +e
          node supabase/check_project.js 2>&1 | tee "$RUNNER_TEMP/check.txt"; rc=${PIPESTATUS[0]}
          bash supabase/report.sh "Project checks" "$RUNNER_TEMP/check.txt"; exit $rc
      - name: Shadow check (archive the live Sheet, rebuild the tables from it, compare with the app)
        run: |
          set +e
          node supabase/shadow_check.js --psql "psql '$DB_URL'" --html index.html --live "$SHEET_URL" 2>&1 | tee "$RUNNER_TEMP/shadow.txt"; rc=${PIPESTATUS[0]}
          bash supabase/report.sh "Shadow check" "$RUNNER_TEMP/shadow.txt"; exit $rc
      - name: After the move, carry over saves that still reached the Sheet
        run: |
          set +e
          if [ -z "$(psql "$DB_URL" -Atqc "select value from backend_state where key = 'cutover_at'")" ]; then echo "Not moved yet: nothing to carry over." | tee "$RUNNER_TEMP/late.txt"; bash supabase/report.sh "Late saves" "$RUNNER_TEMP/late.txt"; exit 0; fi
          node supabase/replay_late.js --psql "psql '$DB_URL'" --live "$SHEET_URL" 2>&1 | tee "$RUNNER_TEMP/late.txt"; rc=${PIPESTATUS[0]}
          bash supabase/report.sh "Late saves" "$RUNNER_TEMP/late.txt"; exit $rc
