# v21.13: draws the lock screen widget's mark (native/widget/DialedInWidget.swift, the part between "MARK: mark" and
# "MARK: end of mark") on GitHub's Mac with SwiftUI, white on a dark and a light background like the lock screen, and
# keeps the pictures (artifact widget-render). A check that the real code draws what the mockups show; iOS's own
# lock screen look (one color, matched to the clock) is only on a phone. Runs when pushed to `widget-render`, or by hand.
name: widget render
on:
  push:
    branches: [widget-render]
  workflow_dispatch:

jobs:
  render:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          x=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -E 'Xcode_[0-9.]+\.app$' | sort -V | tail -1); [ -n "$x" ] && sudo xcode-select -s "$x"; xcodebuild -version | head -1
      - name: Draw the mark
        run: |
          set -e
          mkdir -p build/render
          src=native/widget/DialedInWidget.swift
          awk '/MARK: mark /{on=1} /MARK: end of mark/{on=0} on' "$src" > build/mark.swift
          [ -s build/mark.swift ] || { echo "::error title=Render::No mark section in $src"; exit 1; }
          cat > build/main.swift <<'SWIFT'
          import SwiftUI
          import AppKit
          @MainActor func save<V: View>(_ v: V, _ name: String, w: CGFloat, h: CGFloat, light: Bool) {
              let bg = light ? Color(red: 0.86, green: 0.88, blue: 0.84) : Color(red: 0.06, green: 0.13, blue: 0.11)
              let r = ImageRenderer(content: ZStack { bg; v }.frame(width: w, height: h).foregroundStyle(Color.white).environment(\.colorScheme, .dark))
              r.scale = 4
              guard let img = r.nsImage, let tiff = img.tiffRepresentation, let rep = NSBitmapImageRep(data: tiff),
                    let png = rep.representation(using: .png, properties: [:]) else { print("could not draw \(name)"); exit(1) }
              try! png.write(to: URL(fileURLWithPath: "build/render/\(name).png"))
              print("drew \(name)")
          }
          MainActor.assumeIsolated {
              for light in [false, true] {
                  let t = light ? "light" : "dark"
                  save(DialedRingsMark(width: 62).frame(width: 72, height: 72), "widget_\(t)", w: 96, h: 96, light: light)
              }
          }
          SWIFT
          cat build/mark.swift build/main.swift > build/render.swift
          swiftc -swift-version 5 -o build/render-bin build/render.swift 2> build/compile.log || { head -60 build/compile.log; echo "::error title=Render::The mark didn't compile ($(grep -c 'error:' build/compile.log) errors)"; exit 1; }
          ./build/render-bin
          ls -la build/render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-render
          path: build/render
          if-no-files-found: warn
