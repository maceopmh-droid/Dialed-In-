# Runs on every push: the parts of the test battery that don't need anyone's real data.
# (The full battery, with a copy of the real data, stays private and still runs before every release.)
name: checks
on:
  push:
  pull_request:

jobs:
  build:
    name: index.html matches src/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build from src/ (version in three places, icon link, scripts parse, no duplicate methods)
        run: python3 build.py --out "$RUNNER_TEMP/built.html"
      - name: The committed index.html is exactly what src/ builds
        run: cmp "$RUNNER_TEMP/built.html" index.html

  privacy:
    name: database privacy rules
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Who sees what, as pretend people
        run: python3 supabase/test_rls.py --host localhost --user postgres
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: The app's two calls (pull_events, push_event) and claiming names
        run: node supabase/test_api.js --host localhost --user postgres
      - name: "The Shot Logger: machines sending shots, drafts, posting (v16.9)"
        run: node supabase/test_shots.js --host localhost --user postgres
      - name: "Tea (v17.0): teas save as teas, tea sessions keep their steeps, teas and coffees never mix"
        run: node supabase/test_tea.js --host localhost --user postgres
      - name: "A coffee's picture (v17.4): saved as picked, kept by older saves and likes, photos only from your own folder"
        run: node supabase/test_cover.js --host localhost --user postgres

  machine-functions:
    name: Shot Logger machine functions (Deno)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the functions as Supabase will run them
        run: deno check supabase/functions/shot-inbox/index.ts supabase/functions/machine-sync/index.ts
      - name: Run them for real (Deno, postgres.js, the database)
        env:
          PGHOST: localhost
          PGUSER: postgres
        run: bash supabase/functions/try_functions.sh
