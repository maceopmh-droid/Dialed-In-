# v21.3: deploys the share-photo function (a share link opened signed out asks it for its session's photo), then checks
# that it answers: a made-up link gets no photo, and one session shared with Everyone that has a stored photo gets an
# address. Prints only status codes and counts (GitHub's logs are public): never a link, an id or anyone's data.
# Needs the SUPABASE_ACCESS_TOKEN secret and SUPABASE_DB_PASSWORD (or SUPABASE_DB_URL). Runs when pushed to the
# `supabase-share` branch; safe to run again (it only redeploys the function).
name: supabase share
on:
  push:
    branches: [supabase-share]

jobs:
  share:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: glombusdjwlrgjihnylk
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Is there an access token yet?
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "No SUPABASE_ACCESS_TOKEN secret yet: nothing deployed." > "$RUNNER_TEMP/c.txt"; cat "$RUNNER_TEMP/c.txt"; bash supabase/report.sh "share-photo" "$RUNNER_TEMP/c.txt"; fi
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.skip != '1'
        with:
          version: latest
      - name: Deploy the share-photo function
        if: steps.cfg.outputs.skip != '1'
        run: |
          set +e
          supabase functions deploy share-photo --project-ref "$PROJECT_REF" --no-verify-jwt 2>&1 | tee "$RUNNER_TEMP/d.txt"; rc=${PIPESTATUS[0]}
          bash supabase/report.sh "Deploy share-photo" "$RUNNER_TEMP/d.txt"; exit $rc
      - name: Find the database
        if: steps.cfg.outputs.skip != '1'
        run: |
          set +e
          bash supabase/find_db.sh 2> "$RUNNER_TEMP/find.txt"; rc=$?
          cat "$RUNNER_TEMP/find.txt"; [ $rc -eq 0 ] || bash supabase/report.sh "Find the database" "$RUNNER_TEMP/find.txt"; exit $rc
      - name: Check it answers
        if: steps.cfg.outputs.skip != '1'
        run: |
          set +e
          F="https://$PROJECT_REF.supabase.co/functions/v1/share-photo"
          sleep 5
          bad=$(curl -s -o /dev/null -w '%{http_code}' "$F?s=not-a-session")
          ref=$(psql "$DB_URL" -Atqc "select coalesce(s.legacy_id, s.id::text) from sessions s join session_photos p on p.session_id = s.id where p.path like 'sb:%' and internal.share_photo_path(coalesce(s.legacy_id, s.id::text)) is not null order by s.brewed_at desc limit 1;" 2>/dev/null)
          echo "::add-mask::$ref"
          n=$(psql "$DB_URL" -Atqc "select count(*) from sessions s join session_photos p on p.session_id = s.id where p.path like 'sb:%' and internal.share_photo_path(coalesce(s.legacy_id, s.id::text)) is not null;" 2>/dev/null)
          {
            echo "a made-up link: $bad (404 expected)"
            echo "sessions a share link would show with a stored photo: ${n:-0}"
            if [ -n "$ref" ]; then
              body=$(curl -s "$F?s=$ref"); code=$(curl -s -o /dev/null -w '%{http_code}' "$F?s=$ref")
              if echo "$body" | grep -q '"url":"https://'; then echo "one of them: $code, an address came back (PASS)"; else echo "one of them: $code, no address (FAIL)"; fi
              img=$(echo "$body" | sed -n 's/.*"url":"\([^"]*\)".*/\1/p'); [ -n "$img" ] && echo "its photo loads: $(curl -s -o /dev/null -w '%{http_code}' "$img")"
            else
              echo "(none to try yet)"
            fi
          } | tee "$RUNNER_TEMP/k.txt"
          bash supabase/report.sh "share-photo check" "$RUNNER_TEMP/k.txt"
          [ "$bad" = "404" ] || [ "$bad" = "400" ]
