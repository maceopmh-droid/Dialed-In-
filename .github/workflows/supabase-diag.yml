# Read-only look at how communities, members and friendships stand (first names, counts and dates only: the logs are
# public). Runs when pushed to the `supabase-diag` branch. Changes nothing.
name: supabase diag
on:
  push:
    branches: [supabase-diag]

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: glombusdjwlrgjihnylk
    steps:
      - uses: actions/checkout@v4
      - name: Find the database
        run: bash supabase/find_db.sh
      - name: Look (read only)
        run: |
          set +e
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atq -c "set default_transaction_read_only = on;" -f supabase/diag.sql > "$RUNNER_TEMP/d.txt" 2>&1; rc=$?
          cat "$RUNNER_TEMP/d.txt"; bash supabase/report.sh "Diag" "$RUNNER_TEMP/d.txt"; exit $rc
      - name: Server logs (counts only)
        if: always()
        run: |
          set +e
          end=$(date -u +%Y-%m-%dT%H:%M:%SZ); start=$(date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%SZ)
          q() { curl -sS -G "https://api.supabase.com/v1/projects/$PROJECT_REF/analytics/endpoints/logs" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                  --data-urlencode "sql=$1" --data-urlencode "iso_timestamp_start=$start" --data-urlencode "iso_timestamp_end=$end"; }
          {
            echo "photo link calls by hour (UTC) and status:"
            q "SELECT formatDateTime(toStartOfHour(timestamp), '%H') AS hr, log_attributes['response.status_code'] AS code, count() AS n FROM logs WHERE source = 'edge_logs' AND log_attributes['request.path'] LIKE '%object/sign/photos%' GROUP BY hr, code ORDER BY hr, code" | jq -c '.result // .'
            echo "photo link results in the storage logs (status, error code, error name; counts only):"
            q "SELECT formatDateTime(toStartOfHour(timestamp), '%H') AS hr, log_attributes['res.statusCode'] AS st, log_attributes['error.statusCode'] AS est, log_attributes['error.errorCode'] AS code, log_attributes['error.name'] AS name, count() AS n FROM logs WHERE source = 'storage_logs' AND log_attributes['req.url'] LIKE '%sign/photos%' AND log_attributes['res.statusCode'] <> '200' GROUP BY hr, st, est, code, name ORDER BY hr" | jq -c '.result // .'
          } > "$RUNNER_TEMP/l.txt" 2>&1
          cat "$RUNNER_TEMP/l.txt"; bash supabase/report.sh "Logs" "$RUNNER_TEMP/l.txt"
