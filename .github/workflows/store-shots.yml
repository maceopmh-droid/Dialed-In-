# App Store screenshots from the real iPhone app in the simulator (iPhone Pro Max, 1320 x 2868, light and dark), signed in
# as the App Review account so they show only its own sample coffees (supabase/review_sample.sql), never a real person's.
# The simulator copy gets native/store-shots.js and the account's password added; that copy is never uploaded anywhere.
# Screenshots go to the app-store-shots branch. Runs when pushed to the `store-shots` branch.
name: store screenshots
on:
  push:
    branches: [store-shots]

jobs:
  shots:
    runs-on: macos-26   # Apple takes only apps built with Xcode 26 or later
    timeout-minutes: 45
    permissions:
      contents: write   # (only to put the screenshots on the app-store-shots branch)
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.dialedincoffeeapp.ios' }}
      REVIEW_PASSWORD: ${{ secrets.REVIEW_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Use the newest Xcode (Apple takes uploads built with Xcode 26 or later)
        run: |
          x=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -E 'Xcode_[0-9.]+\.app$' | sort -V | tail -1)
          [ -n "$x" ] && sudo xcode-select -s "$x"
          v=$(xcodebuild -version | head -1); echo "::notice title=Xcode::$v"
          [ "$(echo "$v" | sed -E 's/Xcode ([0-9]+).*/\1/')" -ge 26 ] || { echo "::error title=Xcode::$v is older than Xcode 26; Apple won't take the upload."; exit 1; }
      - name: Make the iPhone project
        working-directory: native
        run: |
          set -e
          [ -n "$REVIEW_PASSWORD" ] || { echo "::error title=Screenshots::No REVIEW_PASSWORD secret."; exit 1; }
          sed -i '' "s/\"appId\": \"[^\"]*\"/\"appId\": \"$BUNDLE_ID\"/" capacitor.config.json
          npm install --no-audit --no-fund
          node scripts/www.js
          npx cap add ios
          npx cap sync ios
          bash ios-setup.sh
          echo "VERSION=$(cat www/version.txt)" >> "$GITHUB_ENV"
          if [ -d ios/App/App.xcworkspace ]; then echo "XC=-workspace ios/App/App.xcworkspace" >> "$GITHUB_ENV"; else echo "XC=-project ios/App/App.xcodeproj" >> "$GITHUB_ENV"; fi
      - name: Build for the simulator
        working-directory: native
        run: |
          set -o pipefail
          xcodebuild $XC -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd TARGETED_DEVICE_FAMILY=1 CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$VERSION" build | tail -5
      - name: Take the screenshots
        working-directory: native
        run: |
          set -e
          echo "::add-mask::$REVIEW_PASSWORD"
          dev=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; xs=[x for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'Pro Max' in x['name']]; print(xs[0]['udid'] if xs else '')")
          [ -n "$dev" ] || { echo "::error title=Screenshots::No iPhone Pro Max simulator on this runner."; exit 1; }
          echo "simulator: $(xcrun simctl list devices -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['name'] + ' (' + k.split('.')[-1] + ')' for k in d for x in d[k] if x['udid'] == '$dev'))")"
          xcrun simctl boot "$dev"; xcrun simctl bootstatus "$dev" -b >/dev/null
          python3 -m pip install -q --break-system-packages pillow 2>/dev/null || python3 -m pip install -q pillow
          xcrun simctl io "$dev" screenshot /tmp/warm.png >/dev/null 2>&1 || true
          sleep 60   # let the first-boot notices come and go before the app opens
          xcrun simctl status_bar "$dev" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState discharging --batteryLevel 100
          # the simulator copy only: the screenshot plan and the review account's sign-in
          app=build/dd/Build/Products/Debug-iphonesimulator/App.app
          cp store-shots.js "$app/public/store-shots.js"
          python3 - "$app/public/index.html" <<'PY'
          import json, os, sys
          p = sys.argv[1]; s = open(p).read()
          cfg = {'email': 'appreview@dialed-in.app', 'pw': os.environ['REVIEW_PASSWORD'], 'shotUrl': 'http://127.0.0.1:8765', 'settle': 1800}
          tag = '<script>window.__storeShots = ' + json.dumps(cfg) + ';</script><script src="store-shots.js"></script>'
          assert '</head>' in s
          open(p, 'w').write(s.replace('</head>', tag + '</head>', 1))
          PY
          xcrun simctl install "$dev" "$app"
          mkdir -p build/shots
          # the runner's side: the plan asks for each screenshot and waits until it's taken
          cat > build/server.py <<'PY'
          import http.server, os, subprocess, sys, time, urllib.parse
          from PIL import Image, ImageChops
          dev, out = sys.argv[1], sys.argv[2]
          def grab(path): subprocess.run(['xcrun', 'simctl', 'io', dev, 'screenshot', path], capture_output=True)
          def changed(a, b):   # pixels that differ in the top band, where iOS shows notification banners
              box = (0, 110, 1320, 480)
              d = ImageChops.difference(Image.open(a).convert('L').crop(box), Image.open(b).convert('L').crop(box))
              return sum(1 for v in d.tobytes() if v > 24)
          class H(http.server.BaseHTTPRequestHandler):
              def log_message(self, *a): pass
              def do_GET(self):
                  u = urllib.parse.urlparse(self.path); q = urllib.parse.parse_qs(u.query)
                  look = open(os.path.join(out, '.look')).read().strip()
                  if u.path == '/hello':
                      grab(os.path.join(out, '.warm.png')); print(f'hello {look}', flush=True)
                  elif u.path == '/shot':
                      name = ''.join(c for c in q.get('name', ['x'])[0] if c.isalnum() or c in '_-')
                      final, b = os.path.join(out, f'{name}_{look}.png'), os.path.join(out, f'.{name}_{look}_check.png')
                      try:
                          # one screenshot, and a second 1.5 s later: if the top of the screen differs (a notification banner
                          # passing), wait and take it again
                          grab(final); tries = 0
                          while tries < (1 if q.get('check', ['1'])[0] != '0' else 0):
                              time.sleep(1.5); grab(b)
                              if changed(final, b) < 400: break
                              tries += 1; time.sleep(4); grab(final)
                          print(f'shot {name}_{look}' + (f' (retaken {tries}x)' if tries else ''), flush=True)
                      except Exception as e:
                          grab(final); print(f'shot {name}_{look} (single: {type(e).__name__}: {str(e)[:120]})', flush=True)
                  elif u.path == '/log':
                      print('log ' + q.get('m', [''])[0], flush=True)
                  elif u.path == '/done':
                      open(os.path.join(out, f'.done_{look}'), 'w').write(q.get('ok', ['?'])[0]); print(f'done {look} ok={q.get("ok", ["?"])[0]}', flush=True)
                  try:
                      self.send_response(200); self.send_header('Access-Control-Allow-Origin', '*'); self.end_headers(); self.wfile.write(b'ok')
                  except OSError: print('(the app had stopped waiting)', flush=True)
          http.server.ThreadingHTTPServer(('127.0.0.1', 8765), H).serve_forever()
          PY
          echo light > build/shots/.look
          python3 -W ignore build/server.py "$dev" build/shots > build/server.log 2>&1 &
          # a first pass that's thrown away: the app's first launch (signing in, first drawing) is slow and can lag behind
          for look in warm light dark; do
            echo $look > build/shots/.look
            xcrun simctl ui "$dev" appearance $([ $look = dark ] && echo dark || echo light)
            xcrun simctl terminate "$dev" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch --console-pty "$dev" "$BUNDLE_ID" > "build/console_$look.log" 2>&1 &
            # if the app can't reach the runner, it says so in its log and holds each screen 8 s: take it from there
            ( tail -n +1 -f "build/console_$look.log" | while IFS= read -r l; do case "$l" in *DIALED-SHOT-FAIL*/shot?name=*) n=${l##*name=}; n=${n%% *}; [ -f "build/shots/${n}_$look.png" ] || { sleep 2; xcrun simctl io "$dev" screenshot "build/shots/${n}_$look.png" >/dev/null 2>&1; echo "shot (fallback) ${n}_$look" >> build/server.log; };; esac; done ) &
            watcher=$!
            for i in $(seq 1 120); do [ -f "build/shots/.done_$look" ] && break; sleep 3; done
            kill $watcher 2>/dev/null || true
            grep -o 'DIALED-[A-Z-]*[^"]*' "build/console_$look.log" | grep -v '^DIALED-SHOT ' | head -10 || true
            [ -f "build/shots/.done_$look" ] || echo "::warning title=Screenshots::the $look run didn't finish in 6 minutes"
          done
          cat build/server.log
          echo "::notice title=Screenshot log::$(tr '\n' ' ' < build/server.log | cut -c1-900)"
          rm -f build/shots/00_*.png build/shots/*_warm.png build/shots/*'&'*.png   # the throwaway screenshots
          rm -f "$app/public/index.html"   # (the copy with the password; the runner is thrown away anyway)
          n=$(ls build/shots/*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "::notice title=Screenshots::$n screenshots ($(ls build/shots/*.png 2>/dev/null | xargs -n1 basename | tr '\n' ' '))"
          [ "$n" -gt 0 ]
      - name: Put the screenshots on the app-store-shots branch
        working-directory: native
        run: |
          d="$RUNNER_TEMP/shots"; rm -rf "$d"; mkdir -p "$d"; cp build/shots/*.png "$d/"
          cd "$d"; git init -q; git checkout -q -b app-store-shots
          git add -A; git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "App Store screenshots from run ${{ github.run_number }} ($GITHUB_SHA)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" app-store-shots
