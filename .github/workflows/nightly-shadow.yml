# Phase 1: every night, check the shadow backend against the live Sheet: new Sheet saves go into the archive, the
# tables are rebuilt from the live Sheet, and the app must show exactly the same thing from either side.
# Does nothing until a SUPABASE_DB_PASSWORD (or SUPABASE_DB_URL) secret exists (Settings > Secrets and variables >
# Actions), so it's safe to have in the repository before Supabase is set up. Scheduled runs only happen once this
# file is on main. After the move it also carries over any save that still reached the Sheet (replay_late.js).
# The logs are public: it prints only counts, record ids, field names and first names.
name: nightly shadow check
on:
  schedule:
    - cron: '30 8 * * *'       # 3:30 am Central (08:30 UTC)
  workflow_dispatch:

jobs:
  shadow:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # the Sheet's public read, the same address index.html already uses
      SHEET_URL: https://script.google.com/macros/s/AKfycbxwOpOjQr2Um3y_YIddTIsn8yLAEqyQo5BnF001N9E58O4cT9x-7tMM6XGviIGTkNJp-Q/exec
    steps:
      - name: Is Supabase set up yet?
        id: cfg
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD$SUPABASE_DB_URL" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "No database secret yet: nothing to check."; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.skip != '1'
        with:
          node-version: '20'
      - name: Find the database
        if: steps.cfg.outputs.skip != '1'
        run: |
          set +e
          bash supabase/find_db.sh 2> "$RUNNER_TEMP/find.txt"; rc=$?
          cat "$RUNNER_TEMP/find.txt"; [ $rc -eq 0 ] || bash supabase/report.sh "Find the database" "$RUNNER_TEMP/find.txt"; exit $rc
      - name: Archive the live Sheet, rebuild the tables from it, parity with the app
        if: steps.cfg.outputs.skip != '1'
        run: |
          set +e
          node supabase/shadow_check.js --psql "psql '$DB_URL'" --html index.html --live "$SHEET_URL" 2>&1 | tee "$RUNNER_TEMP/shadow.txt"; rc=${PIPESTATUS[0]}
          bash supabase/report.sh "Shadow check" "$RUNNER_TEMP/shadow.txt"; exit $rc
      - name: After the move, carry over saves that still reached the Sheet
        if: steps.cfg.outputs.skip != '1'
        run: |
          set +e
          if [ -z "$(psql "$DB_URL" -Atqc "select value from backend_state where key = 'cutover_at'")" ]; then echo "Not moved yet: nothing to carry over." | tee "$RUNNER_TEMP/late.txt"; bash supabase/report.sh "Late saves" "$RUNNER_TEMP/late.txt"; exit 0; fi
          node supabase/replay_late.js --psql "psql '$DB_URL'" --live "$SHEET_URL" 2>&1 | tee "$RUNNER_TEMP/late.txt"; rc=${PIPESTATUS[0]}
          bash supabase/report.sh "Late saves" "$RUNNER_TEMP/late.txt"; exit $rc
