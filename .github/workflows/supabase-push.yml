# Sets up phone notifications (Web Push): deploys the send-push function to Supabase, turns on pg_net (how the
# database calls it), and stores the function's address, a shared secret and a VAPID key pair in backend_state
# (made once, never printed; the keys never leave the database). Until this has run, the app shows no switch.
# Needs the SUPABASE_ACCESS_TOKEN secret (Supabase, Account, Access Tokens) and SUPABASE_DB_PASSWORD.
# v14.6, the iPhone app: when the Apple push key is in the secrets (APNS_KEY_P8, APNS_KEY_ID, APPLE_TEAM_ID; from
# developer.apple.com, Keys, with Apple Push Notifications service), it's stored in backend_state too, never printed.
# Runs when pushed to the `supabase-push` branch; safe to run again (it only redeploys the function).
name: supabase push
on:
  push:
    branches: [supabase-push]

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: glombusdjwlrgjihnylk
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
      APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}     # (only so a push key put in the App Store Connect key's secrets is still found)
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.dialedincoffeeapp.ios' }}
    steps:
      - uses: actions/checkout@v4
      - name: Is there an access token yet?
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "No SUPABASE_ACCESS_TOKEN secret yet: nothing set up." > "$RUNNER_TEMP/c.txt"; cat "$RUNNER_TEMP/c.txt"; bash supabase/report.sh "Push setup" "$RUNNER_TEMP/c.txt"; fi
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.skip != '1'
        with:
          version: latest
      - name: Deploy the send-push function
        if: steps.cfg.outputs.skip != '1'
        run: |
          set +e
          supabase functions deploy send-push --project-ref "$PROJECT_REF" --no-verify-jwt 2>&1 | tee "$RUNNER_TEMP/d.txt"; rc=${PIPESTATUS[0]}
          bash supabase/report.sh "Deploy send-push" "$RUNNER_TEMP/d.txt"; exit $rc
      - name: Find the database
        if: steps.cfg.outputs.skip != '1'
        run: |
          set +e
          bash supabase/find_db.sh 2> "$RUNNER_TEMP/find.txt"; rc=$?
          cat "$RUNNER_TEMP/find.txt"; [ $rc -eq 0 ] || bash supabase/report.sh "Find the database" "$RUNNER_TEMP/find.txt"; exit $rc
      - name: Turn on pg_net and store the address, the secret and the keys (once)
        if: steps.cfg.outputs.skip != '1'
        run: |
          set +e
          npm install --no-save --silent web-push@3.6.7 >/dev/null 2>&1
          keys=$(node -e "const k=require('web-push').generateVAPIDKeys(); process.stdout.write(k.publicKey + ' ' + k.privateKey)")
          pub=${keys% *}; priv=${keys#* }; sec=$(openssl rand -hex 24)
          echo "::add-mask::$priv"; echo "::add-mask::$sec"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atq -v pub="$pub" -v priv="$priv" -v sec="$sec" -v url="https://$PROJECT_REF.supabase.co/functions/v1/send-push" > "$RUNNER_TEMP/p.txt" 2>&1 <<'SQL'
          create extension if not exists pg_net;
          insert into backend_state (key, value) values ('vapid_public', :'pub'), ('vapid_private', :'priv'), ('push_secret', :'sec') on conflict (key) do nothing;
          insert into backend_state (key, value) values ('push_url', :'url') on conflict (key) do update set value = excluded.value, updated_at = now();
          select 'pg_net: ' || coalesce((select extversion from pg_extension where extname = 'pg_net'), 'missing');
          select 'keys stored: ' || count(*) from backend_state where key in ('vapid_public', 'vapid_private', 'push_secret', 'push_url');
          select 'phones signed up so far: ' || count(*) from push_subscriptions;
          SQL
          rc=$?
          cat "$RUNNER_TEMP/p.txt"; bash supabase/report.sh "Push setup" "$RUNNER_TEMP/p.txt"; exit $rc
      - name: Store the Apple push key (the iPhone app), when it's there
        if: steps.cfg.outputs.skip != '1'
        run: |
          set +e
          if [ -z "$APNS_KEY_P8" ] || [ -z "$APNS_KEY_ID" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "No Apple push key yet: the iPhone app's notifications wait for it." | tee "$RUNNER_TEMP/a.txt"; bash supabase/report.sh "Apple push" "$RUNNER_TEMP/a.txt"; exit 0
          fi
          # which secrets hold the push key: the ones Apple's push service accepts (the two keys look alike)
          node native/scripts/apple-check.js --push-only > "$RUNNER_TEMP/pk.txt" 2>&1; cat "$RUNNER_TEMP/pk.txt"
          from=$(grep -o 'push_from=.*' "$GITHUB_OUTPUT" 2>/dev/null | tail -1 | cut -d= -f2)
          if [ "$from" = "ASC" ]; then APNS_KEY_P8="$ASC_KEY_P8"; APNS_KEY_ID="$ASC_KEY_ID";
          elif [ "$from" != "APNS" ]; then sed 's/^::[a-z]* title=[^:]*:://' "$RUNNER_TEMP/pk.txt" > "$RUNNER_TEMP/a.txt"; echo "Apple push key not stored." >> "$RUNNER_TEMP/a.txt"; bash supabase/report.sh "Apple push" "$RUNNER_TEMP/a.txt"; exit 1; fi
          APNS_KEY_ID=$(printf '%s' "$APNS_KEY_ID" | tr -d "\"' \t\r\n"); APPLE_TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -d "\"' \t\r\n")
          # the .p8 text however it was pasted: rebuilt as a proper key, and checked before it's stored
          body=$(printf '%s' "$APNS_KEY_P8" | tr -d '\r"' | sed -e 's/-----BEGIN [A-Z ]*-----//g' -e 's/-----END [A-Z ]*-----//g' | tr -d ' \n\t')
          pem=$(printf -- '-----BEGIN PRIVATE KEY-----\n%s\n-----END PRIVATE KEY-----\n' "$(printf '%s\n' "$body" | fold -w 64)")
          if ! printf '%s' "$pem" | openssl pkey -noout 2>/dev/null; then
            echo "The APNS_KEY_P8 secret doesn't read as a .p8 key ($(printf '%s' "$body" | wc -c | tr -d ' ') characters after tidying; a key is about 200). Paste the whole text of the AuthKey_….p8 file again." | tee "$RUNNER_TEMP/a.txt"; bash supabase/report.sh "Apple push" "$RUNNER_TEMP/a.txt"; exit 1
          fi
          APNS_KEY_P8="$pem"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atq -v k="$APNS_KEY_P8" -v kid="$APNS_KEY_ID" -v team="$APPLE_TEAM_ID" -v topic="$BUNDLE_ID" > "$RUNNER_TEMP/a.txt" 2>&1 <<'SQL'
          insert into backend_state (key, value) values ('apns_key', :'k'), ('apns_key_id', :'kid'), ('apns_team_id', :'team'), ('apns_topic', :'topic')
          on conflict (key) do update set value = excluded.value, updated_at = now();
          select 'Apple push key (accepted by Apple''s push service) stored for ' || (select value from backend_state where key = 'apns_topic');
          select 'iPhones signed up so far: ' || count(*) from push_subscriptions where endpoint like 'apns:%';
          SQL
          rc=$?
          cat "$RUNNER_TEMP/a.txt"; bash supabase/report.sh "Apple push" "$RUNNER_TEMP/a.txt"; exit $rc
      - name: Check the function answers (a wrong secret is turned away)
        if: steps.cfg.outputs.skip != '1'
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://$PROJECT_REF.supabase.co/functions/v1/send-push" -H 'Content-Type: application/json' -H 'x-push-secret: wrong' -d '{"id":1}')
          echo "send-push answered $code (403 expected)" | tee "$RUNNER_TEMP/k.txt"
          bash supabase/report.sh "Function check" "$RUNNER_TEMP/k.txt"
          [ "$code" = "403" ]
